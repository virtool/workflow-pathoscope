name: CI

on:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"

  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  commitlint:
    name: Commitlint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: commitlint
        uses: wagoid/commitlint-github-action@v6
  ruff-format:
    name: Ruff / Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install mise
        uses: jdx/mise-action@v3
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync
      - name: Check formatting
        run: uv run ruff format --check .
  ruff-lint:
    name: Ruff / Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install mise
        uses: jdx/mise-action@v3
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync
      - name: Check linting
        run: uv run ruff check .
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Docker
        uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: base
          push: false
          tags: virtool/pathoscope:base
          cache-from: type=gha
          cache-to: type=gha,mode=max
  test-rust:
    name: Test / Rust
    runs-on: ubuntu-24.04
    needs: [build]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Docker
        uses: docker/setup-buildx-action@v3
      - name: Setup mise
        uses: jdx/mise-action@v3
      - name: Test Rust
        run: mise run test:rust
  test-python:
    name: Test / Python
    runs-on: ubuntu-24.04
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Docker
        uses: docker/setup-buildx-action@v3
      - name: Setup mise
        uses: jdx/mise-action@v3
      - name: Test Python
        run: mise run test:python
  release:
    name: "Publish / Release"
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [build, commitlint, test-rust, test-python]
    outputs:
      git-tag: ${{ steps.semantic.outputs.git-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install semantic-release
        run: npm i semantic-release@v24.2.5 @semantic-release/exec@7.1.0 conventional-changelog-conventionalcommits@9.0.0
      - name: Run semantic-release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
  ghcr:
    name: "Publish / GHCR"
    runs-on: ubuntu-24.04
    if: |
      github.repository_owner == 'Virtool' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.release.outputs.git-tag != ''
    needs: [release]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.git-tag }}
      - name: Write VERSION file
        run: echo ${{ needs.release.outputs.git-tag }} > VERSION
      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          context: git
          images: ${{ env.REGISTRY }}/virtool/pathoscope
      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          target: "base"
