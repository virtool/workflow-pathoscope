[project]
name = "workflow-pathoscope"
version = "0.1.0"
description = "A workflow for detecting known viruses in Virtool"
readme = "README.md"
requires-python = ">=3.13.7,<3.14"
license = "MIT"
dependencies = [
    "virtool",
]
authors = [
    {name="Ian Boyes"},
    {name="Blake Smith"},
    {name="Mallory Loria"},
    {name="Lilly Roberts"},
    {name="Markus Swoveland"},
]

[dependency-groups]
dev = [
    "maturin[patchelf]>=1.13.3",
    "pysam>=0.24.0",
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio<=1.4.0,<2.0.0",
    "pytest-mock<=3.15.1,<4.0.0",
    "pytest-structlog>=1.1",
    "ruff>=0.15.15",
    "syrupy>=4.9.1",
]

[tool.maturin]
python-source = "python"
module-name = "workflow_pathoscope.rust"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv.sources]
virtool = { path = "../virtool.reecehoffmann-vir-2315-workflowapiclient-cache-methods-and-tar-packaging-helper", editable = true }

[build-system]
requires = ["maturin>=1.13.3,<2.0"]
build-backend = "maturin"
